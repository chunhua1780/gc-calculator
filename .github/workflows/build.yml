name: Build APK
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install Cordova
      run: npm install -g cordova
    - name: Build APK
      run: |
        cordova create app com.gc.calculator "计算器"
        cp index.html app/www/index.html
        mkdir -p app/res
        cp icon512.png app/res/icon.png
        cd app
        cordova platform add android
        sed -i 's|</widget>|    <preference name="android-windowSoftInputMode" value="adjustResize"/>\n    <preference name="Orientation" value="portrait"/>\n    <icon src="res/icon.png"/>\n</widget>|' config.xml
        mkdir -p hooks/after_prepare
        cp ../icon-foreground.png res/icon-foreground.png
        printf '%s\n' \
          '#!/usr/bin/env node' \
          'const fs=require("fs"),path=require("path");' \
          'const resDir=path.join(__dirname,"..","..","platforms","android","app","src","main","res");' \
          'fs.mkdirSync(path.join(resDir,"mipmap-anydpi-v26"),{recursive:true});' \
          'fs.mkdirSync(path.join(resDir,"drawable"),{recursive:true});' \
          'fs.mkdirSync(path.join(resDir,"drawable-nodpi"),{recursive:true});' \
          'const xml="<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">\n  <background android:drawable=\"@drawable/ic_launcher_background\"/>\n  <foreground android:drawable=\"@drawable/ic_launcher_foreground\"/>\n</adaptive-icon>\n";' \
          'fs.writeFileSync(path.join(resDir,"mipmap-anydpi-v26","ic_launcher.xml"),xml);' \
          'fs.writeFileSync(path.join(resDir,"mipmap-anydpi-v26","ic_launcher_round.xml"),xml);' \
          'fs.writeFileSync(path.join(resDir,"drawable","ic_launcher_background.xml"),"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<shape xmlns:android=\"http://schemas.android.com/apk/res/android\"><solid android:color=\"#1c1c1e\"/></shape>\n");' \
          'fs.copyFileSync(path.join(__dirname,"..","..","res","icon-foreground.png"),path.join(resDir,"drawable-nodpi","ic_launcher_foreground.png"));' \
          'console.log("[adaptive-icon hook] done");' \
          > hooks/after_prepare/010_adaptive_icon.js
        chmod +x hooks/after_prepare/010_adaptive_icon.js
        cordova build android
        find . -name "*.apk" -path "*debug*" -exec cp {} ../gc-calculator.apk \;
    - name: Find APK
      run: find . -name "*.apk" 2>/dev/null
    - uses: actions/upload-artifact@v4
      with:
        name: 计算器-APK
        path: gc-calculator.apk
        retention-days: 30
    - name: Publish release (public download link)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: 计算器 - 最新版
        body: 自动构建 · commit ${{ github.sha }}
        files: gc-calculator.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
