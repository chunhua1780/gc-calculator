<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4d"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
    <linearGradient id="orangeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb340"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
    <filter id="plateShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- 背景圆角方形 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 计算器机身 -->
  <rect x="106" y="82" width="300" height="348" rx="36" fill="url(#plate)" filter="url(#plateShadow)"/>

  <!-- 屏幕 -->
  <rect x="132" y="110" width="248" height="92" rx="16" fill="#0a0a0a"/>
  <text x="356" y="176" text-anchor="end" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="52" font-weight="300" fill="#ffb340">88</text>

  <!-- 按键网格：4列3行 -->
  <g>
    <!-- row1 -->
    <circle cx="167" cy="240" r="26" fill="#d6d6d8"/>
    <circle cx="234" cy="240" r="26" fill="#d6d6d8"/>
    <circle cx="301" cy="240" r="26" fill="#d6d6d8"/>
    <circle cx="368" cy="240" r="26" fill="url(#orangeG)"/>
    <!-- row2 -->
    <circle cx="167" cy="306" r="26" fill="#5a5a5c"/>
    <circle cx="234" cy="306" r="26" fill="#5a5a5c"/>
    <circle cx="301" cy="306" r="26" fill="#5a5a5c"/>
    <circle cx="368" cy="306" r="26" fill="url(#orangeG)"/>
    <!-- row3 -->
    <circle cx="167" cy="372" r="26" fill="#5a5a5c"/>
    <circle cx="234" cy="372" r="26" fill="#5a5a5c"/>
    <circle cx="301" cy="372" r="26" fill="#5a5a5c"/>
    <circle cx="368" cy="372" r="26" fill="url(#orangeG)"/>
  </g>
</svg>
